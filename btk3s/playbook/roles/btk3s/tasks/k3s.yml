---
- name: Install k3s
  ansible.builtin.shell: set -o pipefail && curl -sfL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: "{{ k3s_install_exec }}"
    K3S_KUBECONFIG_MODE: "{{ k3s_kubeconfig_mode }}"

- name: Ensure k3s service is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Point KUBECONFIG at the k3s kubeconfig for the login user
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
    create: true
    owner: "{{ dev_user }}"
    mode: "0644"
