---
- name: Check current Prometheus version
  ansible.builtin.command: "{{ prometheus_install_dir }}/prometheus --version"
  register: prometheus_current_version
  changed_when: false
  failed_when: false

- name: Determine system architecture
  ansible.builtin.set_fact:
    prometheus_arch: >-
      {{ 'arm64' if ansible_facts['architecture'] == 'aarch64'
         else 'armv7' if ansible_facts['architecture'] == 'armv7l'
         else 'amd64' }}

- name: Set download URL
  ansible.builtin.set_fact:
    prometheus_url: >-
      https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}.tar.gz

- name: Create prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present

- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_config_dir }}/file_sd"
    - "{{ prometheus_data_dir }}"

- name: Download and install Prometheus
  when: >
    prometheus_current_version.rc != 0 or
    prometheus_version not in prometheus_current_version.stdout
  block:
    - name: Download Prometheus tarball
      ansible.builtin.get_url:
        url: "{{ prometheus_url }}"
        dest: /tmp/prometheus.tar.gz
        mode: "0644"

    - name: Extract Prometheus archive
      ansible.builtin.unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install Prometheus binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}"
        dest: "{{ prometheus_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      loop:
        - prometheus
        - promtool
      notify: Restart Prometheus

    - name: Install console templates and libraries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}/{{ item }}"
        dest: "{{ prometheus_config_dir }}/{{ item }}"
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_group }}"
        mode: "0755"
        remote_src: true
      loop:
        - consoles
        - console_libraries

    - name: Clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus.tar.gz
        - "/tmp/prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}"

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
    validate: "{{ prometheus_install_dir }}/promtool check config %s"
  notify: Reload Prometheus

- name: Deploy Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus

- name: Ensure Prometheus is started and enabled
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
